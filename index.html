<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<title>Resultados de lotería</title>
<style>
:root{--bg:#f5f6f8;--ink:#14213d;--muted:#5b6475;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#10141f;--ink:#eef1f7;--muted:#a3abbd;--card:#1b2132}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:1.7rem;margin:8px 0 4px}
p.sub{color:var(--muted);margin:0 0 20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;align-items:flex-end;min-height:104px;padding:14px;border-radius:14px;color:#fff;text-decoration:none;font-weight:700;font-size:1.05rem;line-height:1.2}
.tile:active{transform:scale(.97)}
.tile:focus-visible,.back:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.back{display:inline-block;margin:4px 0 16px;padding:10px 14px;border-radius:10px;background:var(--card);color:var(--ink);text-decoration:none;font-weight:600}
.head{border-radius:14px;padding:28px 18px;color:#fff;font-size:1.6rem;font-weight:800}
.empty{margin-top:16px;padding:18px;border-radius:14px;background:var(--card);color:var(--muted)}
.screen{display:none}
.screen.on{display:block}
</style>
</head>
<body>
<main>
  <section id="home" class="screen">
    <h1>Resultados de lotería</h1>
    <p class="sub">Elige un juego</p>
    <div class="grid" id="grid"></div>
  </section>
  <section id="game" class="screen">
    <a class="back" href="#">Volver</a>
    <div class="head" id="gameTitle"></div>
    <div class="empty">Todavía no hay resultados de este juego.</div>
  </section>
</main>
<script>
var GAMES=[
 {id:"primitiva",n:"La Primitiva",c:"#1b7a43"},
 {id:"bonoloto",n:"Bonoloto",c:"#0f766e"},
 {id:"euromillones",n:"Euromillones",c:"#1d4ed8"},
 {id:"gordo",n:"El Gordo de la Primitiva",c:"#b91c1c"},
 {id:"nacional",n:"Lotería Nacional",c:"#7c3aed"},
 {id:"quiniela",n:"La Quiniela",c:"#c2410c"},
 {id:"eurodreams",n:"EuroDreams",c:"#be185d"},
 {id:"lototurf",n:"Lototurf",c:"#4d7c0f"},
 {id:"quintuple",n:"Quíntuple Plus",c:"#0e7490"},
 {id:"quinigol",n:"Quinigol",c:"#a16207"},
 {id:"navidad",n:"Lotería de Navidad",c:"#9f1239"},
 {id:"nino",n:"El Niño",c:"#3730a3"}
];
var grid=document.getElementById("grid");
GAMES.forEach(function(g){
  var a=document.createElement("a");
  a.className="tile";a.href="#"+g.id;a.textContent=g.n;a.style.background=g.c;
  grid.appendChild(a);
});
function route(){
  var id=location.hash.slice(1);
  var g=GAMES.filter(function(x){return x.id===id})[0];
  document.getElementById("home").classList.toggle("on",!g);
  document.getElementById("game").classList.toggle("on",!!g);
  if(g){
    var t=document.getElementById("gameTitle");
    t.textContent=g.n;t.style.background=g.c;
    document.title=g.n;
  }else{document.title="Resultados de lotería"}
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
