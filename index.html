<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESTANC DEL PASSEIG · Resultados de lotería</title>
<style>
  :root {
    color-scheme: light dark;
    --fondo: #f5f6f2;
    --texto: #1c2a2e;
    --suave: #5b6b70;
    --linea: #d8ddd5;
    --prim: #1f7a4d;
    --bono: #b5432a;
    --euro: #2349a8;
    --dream: #7a3f9e;
    --gordo: #0f7c8a;
    --nacional: #6c6794;
    --quin: #a0762a;
    --turf: #8a5a2b;
    --rojo: #c8102e;
    --tinte: 14%;
    --estrella: #f2b01e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #182024;
      --texto: #eef1ec;
      --suave: #a3b0b3;
      --linea: #34434a;
      --prim: #2fa468;
      --bono: #d9674c;
      --euro: #5b82e0;
      --dream: #b684d8;
      --gordo: #43b8c6;
      --nacional: #a9a3d6;
      --quin: #d9a84a;
      --turf: #c08a55;
      --rojo: #ff7a6b;
      --tinte: 24%;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--fondo); }
  body {
    margin: 0;
    color: var(--texto);
    background: var(--fondo);
    font-family: "Avenir Next", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.4;
  }
  main { max-width: 560px; margin: 0 auto; padding: 28px 20px 48px; }
  h1 { font-size: 1.9rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  h1.marca { font-size: 1.65rem; letter-spacing: 0.03em; line-height: 1.15; margin: 0 0 6px; color: var(--rojo); text-align: center; }
  .adorno { margin: 0 0 8px; color: var(--suave); }
  .adorno svg { display: block; width: 100%; max-width: 360px; height: auto; }
  @keyframes parpadeo { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .adorno .impar { animation: parpadeo 2.6s ease-in-out infinite; }
  .adorno .par { animation: parpadeo 2.6s ease-in-out 1.3s infinite; }
  @media (prefers-reduced-motion: reduce) { .adorno .impar, .adorno .par { animation: none; } }
  .subtitulo { margin: 0 0 2px; font-size: 1.1rem; font-weight: 600; }
  .actualizado { margin: 0 0 8px; color: var(--suave); font-size: 0.95rem; }
  .aviso { color: var(--suave); }
  .error { color: var(--bono); }
  a { color: inherit; }

  .c-prim { --c: var(--prim); }
  .c-bono { --c: var(--bono); }
  .c-euro { --c: var(--euro); }
  .c-dream { --c: var(--dream); }
  .c-gordo { --c: var(--gordo); }
  .c-nacional { --c: var(--nacional); }
  .c-quin { --c: var(--quin); }
  .c-turf { --c: var(--turf); }

  /* Bolas */
  .bolas { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .bola {
    width: var(--t, 40px); height: var(--t, 40px); border-radius: 50%;
    display: grid; place-items: center;
    font-size: calc(var(--t, 40px) * 0.4); font-weight: 700; color: #fff;
    font-variant-numeric: tabular-nums;
    background: radial-gradient(circle at 32% 28%, rgba(255,255,255,0.35), transparent 45%), var(--c);
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    font-size: 0.85rem; padding: 2px 10px; border-radius: 999px;
    border: 1.5px solid var(--c); color: var(--texto);
    font-variant-numeric: tabular-nums;
  }
  .chip.estrellas { border-color: var(--estrella); }

  /* Loteria Nacional: premios y terminaciones */
  .premios { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px 28px; }
  .premio .rotulo { display: inline-block; font-size: 0.9rem; color: var(--suave); border-bottom: 1px dotted var(--c); padding-bottom: 2px; }
  .premio .gran { display: block; margin-top: 4px; font-size: 2.1rem; font-weight: 800; line-height: 1.1; color: var(--c); font-variant-numeric: tabular-nums; }
  .premio.segundo .gran { font-size: 1.6rem; }
  .grupo { margin-top: 16px; }
  .grupo h3 { margin: 0 0 6px; padding-bottom: 3px; font-size: 0.9rem; font-weight: 500; color: var(--suave); border-bottom: 1px dotted var(--c); }
  .grupo .nums { display: flex; flex-wrap: wrap; gap: 2px 16px; font-size: 1.25rem; font-weight: 700; color: var(--c); font-variant-numeric: tabular-nums; }

  /* Calendario */
  .resultado .sorteo { border-bottom: 0; padding-top: 18px; }
  .resultado .fecha { font-size: 1.05rem; font-weight: 600; color: var(--texto); }
  .calendario { margin-top: 22px; max-width: 340px; }
  .cal-cab { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .cal-cab h2 { margin: 0; font-size: 0.95rem; }
  .cal-nav { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--linea); background: none; color: var(--texto); font: inherit; font-size: 1.25rem; line-height: 1; cursor: pointer; }
  .cal-nav:disabled { opacity: 0.3; cursor: default; }
  .cal-nav:focus-visible, .dia.con:focus-visible { outline: 3px solid var(--c); outline-offset: 2px; }
  .cal-sem, .cal-dias { display: grid; grid-template-columns: repeat(7, 1fr); }
  .cal-sem span { text-align: center; font-size: 0.78rem; color: var(--suave); padding: 2px 0 4px; }
  .cal-dias { border-top: 1px solid var(--linea); border-left: 1px solid var(--linea); }
  .dia { min-height: 36px; display: grid; place-items: center; margin: 0; padding: 0; font: inherit; font-size: 0.9rem; color: var(--suave); opacity: 0.55; background: none; border: 0; border-right: 1px solid var(--linea); border-bottom: 1px solid var(--linea); font-variant-numeric: tabular-nums; }
  .dia.vacio { opacity: 1; }
  .dia.con { opacity: 1; color: var(--texto); font-weight: 800; cursor: pointer; }
  .dia.con[aria-pressed="true"] { background: var(--c); color: var(--fondo); }
  .cal-nota { margin: 8px 0 0; font-size: 0.8rem; color: var(--suave); }

  /* Inicio: botes y acceso a los resultados */
  .botes { margin-top: 22px; display: grid; gap: 10px; }
  .botes h2 { margin: 0 0 2px; font-size: 1.05rem; }
  .bote {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px;
    padding: 12px 14px 12px 16px; border-left: 6px solid var(--c); border-radius: 0 14px 14px 0;
    background: var(--fondo);
    background: color-mix(in srgb, var(--c) var(--tinte), var(--fondo));
  }
  .bote .izq { flex: 1 1 auto; min-width: 0; }
  .bote .nombre { font-weight: 700; }
  .bote .sub { display: block; font-size: 0.8rem; font-weight: 600; color: var(--suave); line-height: 1.2; }
  .bote .cuando { display: block; margin-top: 2px; font-size: 0.85rem; color: var(--suave); }
  .bote .importe { flex: 0 0 auto; margin-left: auto; text-align: right; }
  .bote .cifra { display: block; font-size: 1.35rem; font-weight: 800; color: var(--c); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bote .peque { display: block; font-size: 0.75rem; font-weight: 600; color: var(--suave); }
  .consultar {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 14px; padding: 20px 22px; border-radius: 16px;
    background: var(--rojo); color: var(--fondo);
    font-size: 1.25rem; font-weight: 800; text-decoration: none;
  }
  .consultar:active { opacity: 0.85; }
  .consultar:focus-visible { outline: 3px solid var(--texto); outline-offset: 3px; }
  .consultar .flecha { font-size: 1.6rem; line-height: 1; }

  /* Portada */
  .juegos { margin-top: 22px; display: grid; gap: 14px; }
  .juego-link {
    display: block; text-decoration: none;
    padding: 16px 16px 16px 16px; border-left: 6px solid var(--c);
    border-radius: 0 14px 14px 0;
    background: var(--fondo);
    background: color-mix(in srgb, var(--c) var(--tinte), var(--fondo));
  }
  .juego-link:active { background: color-mix(in srgb, var(--c) 28%, var(--fondo)); }
  .juego-link:focus-visible, .volver:focus-visible { outline: 3px solid var(--c, var(--texto)); outline-offset: 4px; }
  .juego-link h2 { font-size: 1.3rem; margin: 0; }
  .juego-link .fecha { margin: 2px 0 12px; color: var(--suave); font-size: 0.95rem; }
  .juego-link .bolas { --t: 38px; }
  .ver { display: inline-block; margin-top: 10px; color: var(--texto); font-size: 0.95rem; font-weight: 700; }

  /* Pantalla de un juego */
  .volver { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 14px; padding: 8px 0; color: var(--texto); text-decoration: none; font-size: 1rem; font-weight: 600; }
  .volver .flecha { font-size: 1.3rem; line-height: 1; }
  .cabecera { padding-left: 16px; border-left: 6px solid var(--c); }
  .cabecera h1 { margin: 0; }
  h2.mes { font-size: 1.05rem; margin: 30px 0 4px; padding-bottom: 6px; border-bottom: 1px solid var(--linea); text-transform: none; }
  .sorteo { padding: 14px 0; border-bottom: 1px solid var(--linea); }
  .sorteo .fecha { margin: 0 0 8px; color: var(--suave); font-size: 0.9rem; }
  .sorteo .bolas { --t: 38px; }
</style>
</head>
<body>
<main id="app"><p class="aviso">Cargando resultados…</p></main>

<script>
  const JUEGOS = [
    { id: "primitiva", nombre: "La Primitiva", clase: "c-prim", dias: [4, 6] },
    { id: "elgordo", nombre: "El Gordo de la Primitiva", corto: "El Gordo", sub: "de la Primitiva", clase: "c-gordo", dias: [0] },
    { id: "bonoloto", nombre: "Bonoloto", clase: "c-bono", dias: [1, 2, 3, 4, 5, 6] },
    { id: "euromillones", nombre: "Euromillones", clase: "c-euro", dias: [2, 5] },
    { id: "eurodreams", nombre: "EuroDreams", clase: "c-dream", dias: [1, 4], nota: "al mes durante 30 años" },
    { id: "loterianacional", nombre: "Lotería Nacional", clase: "c-nacional", dias: [4, 6],
      fijos: { 4: "300.000 €", 6: "600.000 €" }, nota: "1er premio a la serie" },
    { id: "quiniela", nombre: "La Quiniela", clase: "c-quin", dias: [0] },
    { id: "lototurf", nombre: "Lototurf", clase: "c-turf", dias: [0] }
  ];
  const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio",
                 "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
  const DIAS_CORTOS = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
  let DATA = null;
  let BOTES = null;

  function crear(etiqueta, clase, texto) {
    const e = document.createElement(etiqueta);
    if (clase) e.className = clase;
    if (texto !== undefined) e.textContent = texto;
    return e;
  }

  function bolas(numeros) {
    const ul = crear("ul", "bolas");
    ul.setAttribute("aria-label", "Números");
    numeros.forEach(function (n) { ul.appendChild(crear("li", "bola", n)); });
    return ul;
  }

  function extras(s) {
    const cont = crear("div", "chips");
    const estrellas = [];
    (s.extras || []).forEach(function (t) {
      const m = /^([A-Z])\s*(\d+)$/.exec(String(t).trim());
      if (!m) return;
      if (m[1] === "E") { estrellas.push(m[2]); return; }
      const propios = { C: "Complementario", R: "Reintegro", S: "Sueño" };
      const nombre = (s.etiquetas && s.etiquetas[m[1]]) || propios[m[1]] || m[1];
      cont.appendChild(crear("span", "chip", nombre + " " + m[2]));
    });
    if (estrellas.length) cont.appendChild(crear("span", "chip estrellas", "Estrellas " + estrellas.join(" y ")));
    if (s.joker) cont.appendChild(crear("span", "chip", "Joker " + s.joker));
    if (s.pleno) cont.appendChild(crear("span", "chip", "Pleno al 15: " + s.pleno));
    return cont.children.length ? cont : null;
  }

  function premios(s) {
    const cont = crear("div", "premios");
    [["Primer premio", s.primero, ""], ["Segundo premio", s.segundo, "segundo"]].forEach(function (p) {
      const d = crear("div", "premio " + p[2]);
      d.appendChild(crear("span", "rotulo", p[0]));
      d.appendChild(crear("span", "gran", p[1]));
      cont.appendChild(d);
    });
    return cont;
  }

  function grupo(titulo, lista) {
    if (!lista || !lista.length) return null;
    const g = crear("div", "grupo");
    g.appendChild(crear("h3", "", titulo));
    const n = crear("div", "nums");
    lista.forEach(function (x) { n.appendChild(crear("span", "", x)); });
    g.appendChild(n);
    return g;
  }

  function enlaceVolver(texto, destino) {
    const a = crear("a", "volver");
    a.href = destino;
    const flecha = crear("span", "flecha", "\u2190");
    flecha.setAttribute("aria-hidden", "true");
    a.appendChild(flecha);
    a.appendChild(document.createTextNode(texto));
    return a;
  }

  function dos(n) { return (n < 10 ? "0" : "") + n; }

  // "2026-11-19" -> "Jue 19 nov"
  function fechaCorta(iso) {
    const f = new Date(iso + "T12:00:00");
    if (isNaN(f)) return "";
    return DIAS_CORTOS[f.getDay()] + " " + f.getDate() + " " + MESES[f.getMonth()].slice(0, 3);
  }

  // Si no hay fecha de bote, se calcula el próximo día de sorteo del juego
  function proximoSorteo(def) {
    if (!def.dias) return "";
    const hoy = new Date();
    for (let i = 0; i < 8; i++) {
      const f = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() + i);
      if (def.dias.indexOf(f.getDay()) !== -1) {
        return f.getFullYear() + "-" + dos(f.getMonth() + 1) + "-" + dos(f.getDate());
      }
    }
    return "";
  }

  function inicio() {
    document.title = "ESTANC DEL PASSEIG";
    const app = document.getElementById("app");
    app.textContent = "";
    app.appendChild(crear("h1", "marca", "ESTANC DEL PASSEIG"));

    const ir = crear("a", "consultar");
    ir.href = "#resultados";
    ir.appendChild(crear("span", "", "Consultar resultados"));
    const fl = crear("span", "flecha", "\u2192");
    fl.setAttribute("aria-hidden", "true");
    ir.appendChild(fl);
    app.appendChild(ir);

    const caja = crear("section", "botes");
    caja.appendChild(crear("h2", "", "Botes de los próximos sorteos"));
    const lista = [];
    JUEGOS.forEach(function (def, orden) {
      if (def.sinInicio) return;
      const b = BOTES && BOTES.botes && BOTES.botes[def.id];
      const iso = (b && b.iso) || proximoSorteo(def);
      let importe = b && b.importe ? b.importe : "";
      if (def.fijos && iso) {
        importe = def.fijos[new Date(iso + "T12:00:00").getDay()] || "";
      }
      lista.push({
        def: def,
        orden: orden,
        iso: iso,
        importe: importe,
        fechaTexto: b && b.fecha ? b.fecha : ""
      });
    });
    const ORDEN_INICIO = ["euromillones", "primitiva", "bonoloto", "elgordo",
                          "eurodreams", "loterianacional", "lototurf", "quiniela"];
    lista.sort(function (x, y) {
      return ORDEN_INICIO.indexOf(x.def.id) - ORDEN_INICIO.indexOf(y.def.id);
    });
    lista.forEach(function (x) {
      const fila = crear("div", "bote " + x.def.clase);
      const izq = crear("div", "izq");
      izq.appendChild(crear("span", "nombre", x.def.corto || x.def.nombre));
      if (x.def.sub) izq.appendChild(crear("span", "sub", x.def.sub));
      const cuando = x.iso ? fechaCorta(x.iso) : x.fechaTexto;
      if (cuando) izq.appendChild(crear("span", "cuando", cuando));
      fila.appendChild(izq);
      if (x.importe) {
        const imp = crear("div", "importe");
        imp.appendChild(crear("span", "cifra", x.importe));
        if (x.def.nota) imp.appendChild(crear("span", "peque", x.def.nota));
        fila.appendChild(imp);
      }
      caja.appendChild(fila);
    });
    app.appendChild(caja);
  }

  function adornoNavidad() {
    const colores = ["#d62839", "#f2b01e", "#2fa468", "#4a90e2"];
    let luces = "";
    for (let i = 0; i < 6; i++) {
      const x = 30 + i * 60;
      luces += '<g class="luz ' + (i % 2 ? "par" : "impar") + '">' +
        '<line x1="' + x + '" y1="15" x2="' + x + '" y2="20" stroke="currentColor" stroke-width="1.5"/>' +
        '<ellipse cx="' + x + '" cy="26" rx="4.5" ry="6" fill="' + colores[i % colores.length] + '"/></g>';
    }
    return '<svg viewBox="0 0 360 34" aria-hidden="true" focusable="false">' +
      '<path d="M0 4 Q30 26 60 4 Q90 26 120 4 Q150 26 180 4 Q210 26 240 4 Q270 26 300 4 Q330 26 360 4" ' +
      'fill="none" stroke="currentColor" stroke-width="1.5"/>' + luces + '</svg>';
  }

  function sorteosDe(id) {
    const lista = DATA.juegos && DATA.juegos[id];
    return Array.isArray(lista) ? lista : [];
  }

  function portada() {
    document.title = "ESTANC DEL PASSEIG · Resultados de lotería";
    const app = document.getElementById("app");
    app.textContent = "";
    app.appendChild(enlaceVolver("Volver al inicio", "#"));
    app.appendChild(crear("h1", "marca", "ESTANC DEL PASSEIG"));
    app.appendChild(crear("p", "subtitulo", "Resultados de lotería"));
    if (DATA.actualizado) {
      const f = new Date(DATA.actualizado + "T12:00:00");
      const t = isNaN(f) ? DATA.actualizado
        : f.toLocaleDateString("es-ES", { day: "numeric", month: "long", year: "numeric" });
      app.appendChild(crear("p", "actualizado", "Actualizado el " + t));
    }
    const cont = crear("div", "juegos");
    JUEGOS.forEach(function (def) {
      const a = crear("a", "juego-link " + def.clase);
      a.href = "#" + def.id;
      a.appendChild(crear("h2", "", def.nombre));
      const ultimo = sorteosDe(def.id)[0];
      if (ultimo) {
        a.appendChild(crear("p", "fecha", ultimo.fecha || ""));
        if (ultimo.primero) {
          a.appendChild(premios(ultimo));
        } else {
          a.appendChild(bolas(ultimo.numeros));
          const ex = extras(ultimo);
          if (ex) a.appendChild(ex);
        }
      } else {
        a.appendChild(crear("p", "fecha", "Sin datos todavía"));
      }
      a.appendChild(crear("span", "ver", "Ver sorteos anteriores"));
      cont.appendChild(a);
    });
    app.appendChild(cont);
  }

  function bloqueSorteo(s) {
    const bloque = crear("div", "sorteo");
    bloque.appendChild(crear("p", "fecha", s.fecha || ""));
    if (s.primero) {
      bloque.appendChild(premios(s));
      [["Últimas 4 cifras", s.cifras4], ["Últimas 3 cifras", s.cifras3],
       ["Últimas 2 cifras", s.cifras2], ["Reintegros", s.reintegros]].forEach(function (g) {
        const el = grupo(g[0], g[1]);
        if (el) bloque.appendChild(el);
      });
    } else {
      bloque.appendChild(bolas(s.numeros));
      const ex = extras(s);
      if (ex) bloque.appendChild(ex);
    }
    return bloque;
  }

  const DIAS_SEMANA = ["L", "M", "M", "J", "V", "S", "D"];

  function pantallaJuego(def) {
    document.title = def.nombre + " · Resultados";
    const app = document.getElementById("app");
    app.textContent = "";

    app.appendChild(enlaceVolver("Volver a los juegos", "#resultados"));

    const cab = crear("div", "cabecera " + def.clase);
    cab.appendChild(crear("h1", "", def.nombre));
    app.appendChild(cab);

    const lista = sorteosDe(def.id);
    if (!lista.length) {
      app.appendChild(crear("p", "aviso", "Todavía no hay sorteos guardados de este juego."));
      return;
    }

    const caja = crear("div", def.clase);
    app.appendChild(caja);

    // Sorteos con fecha, por día
    const porIso = {};
    lista.forEach(function (s) { if (s.iso && !porIso[s.iso]) porIso[s.iso] = s; });
    const dias = Object.keys(porIso).sort();

    const ultimo = lista[0];
    const est = { actual: ultimo, iso: ultimo.iso || null, anio: 0, mes: 0 };
    if (est.iso) {
      const p = est.iso.split("-");
      est.anio = parseInt(p[0], 10);
      est.mes = parseInt(p[1], 10) - 1;
    }

    const resultado = crear("div", "resultado");
    resultado.setAttribute("aria-live", "polite");
    caja.appendChild(resultado);

    const calDiv = crear("div", "calendario");
    if (dias.length) caja.appendChild(calDiv);

    const claveMes = function (a, m) { return a + "-" + dos(m + 1); };
    const primeraClave = dias.length ? dias[0].slice(0, 7) : "";
    const ultimaClave = dias.length ? dias[dias.length - 1].slice(0, 7) : "";

    function pintarResultado() {
      resultado.textContent = "";
      resultado.appendChild(bloqueSorteo(est.actual));
    }

    function elegir(iso) {
      est.iso = iso;
      est.actual = porIso[iso];
      pintarResultado();
      pintarCalendario();
      const sel = calDiv.querySelector('[aria-pressed="true"]');
      if (sel) sel.focus({ preventScroll: true });
      const quieto = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      resultado.scrollIntoView({ behavior: quieto ? "auto" : "smooth", block: "start" });
    }

    function cambiarMes(delta) {
      const f = new Date(est.anio, est.mes + delta, 1);
      est.anio = f.getFullYear();
      est.mes = f.getMonth();
      pintarCalendario();
    }

    function pintarCalendario() {
      calDiv.textContent = "";
      const clave = claveMes(est.anio, est.mes);

      const cabCal = crear("div", "cal-cab");
      const ant = crear("button", "cal-nav", "\u2039");
      ant.type = "button";
      ant.setAttribute("aria-label", "Mes anterior");
      ant.disabled = clave <= primeraClave;
      ant.addEventListener("click", function () { cambiarMes(-1); });
      const sig = crear("button", "cal-nav", "\u203A");
      sig.type = "button";
      sig.setAttribute("aria-label", "Mes siguiente");
      sig.disabled = clave >= ultimaClave;
      sig.addEventListener("click", function () { cambiarMes(1); });
      const titulo = MESES[est.mes] + " de " + est.anio;
      cabCal.appendChild(ant);
      cabCal.appendChild(crear("h2", "", titulo.charAt(0).toUpperCase() + titulo.slice(1)));
      cabCal.appendChild(sig);
      calDiv.appendChild(cabCal);

      const sem = crear("div", "cal-sem");
      sem.setAttribute("aria-hidden", "true");
      DIAS_SEMANA.forEach(function (d) { sem.appendChild(crear("span", "", d)); });
      calDiv.appendChild(sem);

      const rejilla = crear("div", "cal-dias");
      const hueco = (new Date(est.anio, est.mes, 1).getDay() + 6) % 7;
      const total = new Date(est.anio, est.mes + 1, 0).getDate();
      for (let i = 0; i < hueco; i++) rejilla.appendChild(crear("span", "dia vacio"));
      for (let d = 1; d <= total; d++) {
        const iso = est.anio + "-" + dos(est.mes + 1) + "-" + dos(d);
        if (porIso[iso]) {
          const b = crear("button", "dia con", String(d));
          b.type = "button";
          b.setAttribute("aria-pressed", iso === est.iso ? "true" : "false");
          b.setAttribute("aria-label", porIso[iso].fecha || iso);
          b.addEventListener("click", function () { elegir(iso); });
          rejilla.appendChild(b);
        } else {
          rejilla.appendChild(crear("span", "dia", String(d)));
        }
      }
      calDiv.appendChild(rejilla);
      calDiv.appendChild(crear("p", "cal-nota", "Los días en negrita tienen resultado guardado."));
    }

    pintarResultado();
    if (dias.length) pintarCalendario();
  }

  function ruta() {
    if (!DATA) return;
    const id = location.hash.slice(1);
    const def = JUEGOS.find(function (j) { return j.id === id; });
    if (def) pantallaJuego(def);
    else if (id === "resultados") portada();
    else inicio();
    window.scrollTo(0, 0);
  }

  function cargar(url) {
    return fetch(url + "?t=" + Date.now(), { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  // Si todavía no existe el historial, se usa el último resultado guardado
  const pHistorial = cargar("data/historial.json")
    .catch(function () {
      return cargar("data/resultados.json").then(function (d) {
        const juegos = {};
        Object.keys(d.juegos || {}).forEach(function (k) {
          const j = d.juegos[k];
          juegos[k] = j && j.numeros ? [j] : [];
        });
        return { actualizado: d.actualizado, juegos: juegos };
      });
    });
  // Los botes son opcionales: si no se pueden cargar, el inicio muestra los juegos sin importe
  const pBotes = cargar("data/botes.json").catch(function () { return null; });

  Promise.all([pHistorial, pBotes])
    .then(function (r) { DATA = r[0]; BOTES = r[1]; ruta(); })
    .catch(function () {
      const app = document.getElementById("app");
      app.textContent = "";
      app.appendChild(crear("p", "error", "No se han podido cargar los resultados. Si abres este archivo directamente desde el móvil no funcionará; ábrelo desde la dirección de GitHub Pages."));
    });

  window.addEventListener("hashchange", ruta);
</script>
</body>
</html>
