<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resultados de lotería</title>
<style>
  :root {
    color-scheme: light dark;
    --fondo: #f5f6f2;
    --texto: #1c2a2e;
    --suave: #5b6b70;
    --linea: #d8ddd5;
    --prim: #1f7a4d;
    --bono: #b5432a;
    --euro: #2349a8;
    --estrella: #f2b01e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #182024;
      --texto: #eef1ec;
      --suave: #a3b0b3;
      --linea: #34434a;
      --prim: #2fa468;
      --bono: #d9674c;
      --euro: #5b82e0;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--fondo); }
  body {
    margin: 0;
    color: var(--texto);
    background: var(--fondo);
    font-family: "Avenir Next", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.4;
  }
  main { max-width: 560px; margin: 0 auto; padding: 28px 20px 48px; }
  h1 { font-size: 1.9rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .actualizado { margin: 0 0 8px; color: var(--suave); font-size: 0.95rem; }

  .juego { margin: 30px 0 0; padding-left: 16px; border-left: 6px solid var(--c); }
  .juego.prim { --c: var(--prim); }
  .juego.bono { --c: var(--bono); }
  .juego.euro { --c: var(--euro); }
  .juego h2 { font-size: 1.3rem; margin: 0; }
  .fecha { margin: 2px 0 14px; color: var(--suave); font-size: 0.95rem; }

  .bolas, .extras { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px; }
  .bola {
    width: 48px; height: 48px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 1.15rem; font-weight: 700; color: #fff;
    font-variant-numeric: tabular-nums;
    background: radial-gradient(circle at 32% 28%, rgba(255,255,255,0.35), transparent 45%), var(--c);
  }
  .extras { margin-top: 16px; gap: 18px; align-items: flex-end; }
  .extra { display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; color: var(--suave); }
  .extra .fila { display: flex; gap: 8px; }
  .mini {
    width: 38px; height: 38px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 1rem; font-weight: 700; color: var(--c);
    border: 2px solid var(--c);
    font-variant-numeric: tabular-nums;
  }
  .estrella {
    width: 46px; height: 46px;
    display: grid; place-items: center;
    font-size: 1rem; font-weight: 700; color: #3a2a00;
    background: var(--estrella);
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    padding-top: 4px;
  }
  .joker { font-size: 1.15rem; font-weight: 700; letter-spacing: 0.12em; color: var(--texto); font-variant-numeric: tabular-nums; }
  .aviso { color: var(--suave); }
  .error { color: var(--bono); }
</style>
</head>
<body>
<main>
  <h1>Resultados de lotería</h1>
  <p class="actualizado" id="actualizado"></p>
  <div id="juegos" aria-live="polite"><p class="aviso">Cargando resultados…</p></div>
</main>

<script>
  const JUEGOS = [
    { id: "primitiva", nombre: "La Primitiva", clase: "prim" },
    { id: "bonoloto", nombre: "Bonoloto", clase: "bono" },
    { id: "euromillones", nombre: "Euromillones", clase: "euro" }
  ];
  const ETIQUETAS = { C: "Complementario", R: "Reintegro", E: "Estrellas" };

  function crear(etiqueta, clase, texto) {
    const e = document.createElement(etiqueta);
    if (clase) e.className = clase;
    if (texto !== undefined) e.textContent = texto;
    return e;
  }

  function dibujarJuego(def, datos) {
    const sec = crear("section", "juego " + def.clase);
    sec.appendChild(crear("h2", "", def.nombre));

    if (!datos || datos.error || !datos.numeros || !datos.numeros.length) {
      sec.appendChild(crear("p", "aviso", "No hay datos de este juego. Se actualizarán en la próxima ejecución."));
      return sec;
    }

    if (datos.fecha) sec.appendChild(crear("p", "fecha", datos.fecha));

    const bolas = crear("ul", "bolas");
    bolas.setAttribute("aria-label", "Números");
    datos.numeros.forEach(function (n) { bolas.appendChild(crear("li", "bola", n)); });
    sec.appendChild(bolas);

    const extras = crear("ul", "extras");
    const estrellas = [];

    (datos.extras || []).forEach(function (texto) {
      const m = /^([A-Z])\s*(\d+)$/.exec(texto.trim());
      if (!m) return;
      if (m[1] === "E") { estrellas.push(m[2]); return; }
      const li = crear("li", "extra");
      const fila = crear("div", "fila");
      fila.appendChild(crear("span", "mini", m[2]));
      li.appendChild(fila);
      li.appendChild(crear("span", "", ETIQUETAS[m[1]] || m[1]));
      extras.appendChild(li);
    });

    if (estrellas.length) {
      const li = crear("li", "extra");
      const fila = crear("div", "fila");
      estrellas.forEach(function (n) { fila.appendChild(crear("span", "estrella", n)); });
      li.appendChild(fila);
      li.appendChild(crear("span", "", ETIQUETAS.E));
      extras.appendChild(li);
    }

    if (datos.joker) {
      const li = crear("li", "extra");
      li.appendChild(crear("span", "joker", datos.joker));
      li.appendChild(crear("span", "", "Joker"));
      extras.appendChild(li);
    }

    if (extras.children.length) sec.appendChild(extras);
    return sec;
  }

  function dibujar(data) {
    const cont = document.getElementById("juegos");
    cont.textContent = "";
    JUEGOS.forEach(function (def) {
      cont.appendChild(dibujarJuego(def, data.juegos && data.juegos[def.id]));
    });

    if (data.actualizado) {
      const f = new Date(data.actualizado + "T12:00:00");
      const texto = isNaN(f) ? data.actualizado
        : f.toLocaleDateString("es-ES", { day: "numeric", month: "long", year: "numeric" });
      document.getElementById("actualizado").textContent = "Actualizado el " + texto;
    }
  }

  fetch("data/resultados.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(dibujar)
    .catch(function () {
      const cont = document.getElementById("juegos");
      cont.textContent = "";
      cont.appendChild(crear("p", "error", "No se han podido cargar los resultados. Si abres este archivo directamente desde el móvil no funcionará; ábrelo desde la dirección de GitHub Pages."));
    });
</script>
</body>
</html>
